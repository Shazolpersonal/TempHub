# Netlify Configuration for TempHub
# Next.js 14 App Router with API Routes

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"

# API Routes Configuration
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Function Configuration
[functions]
  # Increase timeout for AI image generation (default is 10s)
  # Gemini API calls may take longer
  node_bundler = "esbuild"
  
[[functions.generate]]
  # Specific timeout for image generation endpoint
  timeout = 30

[[functions.upload]]
  # Timeout for image upload endpoint
  timeout = 15

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Strict-Transport-Security will be added by Netlify automatically for HTTPS

# Cache static assets
[[headers]]
  for = "/template-previews/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
